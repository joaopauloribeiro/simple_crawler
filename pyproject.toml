[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "simple-crawler"
version = "2.0.0"
description = "A modernised educational web crawler"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
